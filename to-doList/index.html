<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>todoList</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex justify-center items-center min-h-screen flex-col bg-blue-400">

        <section class="rounded-lg w-full max-w-md">
        <div class="bg-white">

        <h1 class="text-2xl text-center bg-blue-300 ">ToDoリスト</h1>
        <div class="pt-4">
        <input id="ToDo" class="h-12 text-2xl" type="text" placeholder="やることを追加"></input>
        </div>

    <div class="justify-center flex">
    <button id="myButton"
        class="w-44 bg-blue-400 text-white font-bold p-2 m-4 rounded hover:bg-blue-700 transition">追加
    </button>
    </div>
        </div>

        <ul id="todoList" class="mt-4 list-disc pl-5 text-lg flex flex-col gap-2"></ul>
    </section>
        </section>




    <script>
        const button = document.querySelector("#myButton");
        const input = document.querySelector("#ToDo");
        const todoList = document.querySelector("#todoList");


    const text = input.value;


    button.addEventListener("click", () => {
    const text = input.value;

    if (text === "") return; 

    const item = document.createElement("li");
    item.className = "p-2 bg-white rounded flex justify-between";

    const span = document.createElement("span");
    span.textContent = text;


     const doneBtn = document.createElement("button");
        doneBtn.textContent = "完了";
        doneBtn.className = "pl-24 text-sm text-gray-500 hover:text-red-500";


        const list = document.querySelector("#ToDo");

        doneBtn.addEventListener("click", () => {
          span.classList.toggle("line-through");
          span.classList.toggle("text-gray-400");
        });

        item.appendChild(span);
        item.appendChild(doneBtn);

        todoList.appendChild(item);

        input.value = "";

    });



    </script>
</body>
</html>
