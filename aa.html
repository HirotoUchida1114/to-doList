<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ユーザー登録フォーム</title>
  <!-- Tailwind CSS (CDN) -->
  <script src="https://tailwindcss.com"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

  <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
    <h1 class="text-2xl font-bold text-center mb-6 text-gray-800">ユーザー登録</h1>

    <!-- 登録完了時のグローバルメッセージ表示エリア -->
    <div id="successMessage" class="hidden mb-4 p-4 bg-green-100 text-green-700 rounded-md font-semibold text-center">
      登録完了！
    </div>

    <!-- novalidate属性でブラウザ既定のバリデーションを無効化 -->
    <form id="registrationForm" novalidate class="space-y-4">
      
      <!-- 名前 -->
      <div>
        <label for="name" class="block text-sm font-medium text-gray-700 mb-1">名前</label>
        <input type="text" id="name" required
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
        <p id="nameError" class="text-red-500 text-xs mt-1 min-h-[1rem]"></p>
      </div>

      <!-- メールアドレス -->
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700 mb-1">メールアドレス</label>
        <input type="email" id="email" required
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
        <p id="emailError" class="text-red-500 text-xs mt-1 min-h-[1rem]"></p>
      </div>

      <!-- パスワード -->
      <div>
        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">パスワード（8文字以上）</label>
        <input type="password" id="password" required
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
        <p id="passwordError" class="text-red-500 text-xs mt-1 min-h-[1rem]"></p>
      </div>

      <!-- 利用規約同意 -->
      <div>
        <div class="flex items-center">
          <input type="checkbox" id="agree" required
            class="h-4 w-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500">
          <label for="agree" class="ml-2 text-sm text-gray-600">
            <a href="#" class="text-blue-500 hover:underline">利用規約</a>に同意する
          </label>
        </div>
        <p id="agreeError" class="text-red-500 text-xs mt-1 min-h-[1rem]"></p>
      </div>

      <!-- 送信ボタン -->
      <button type="submit"
        class="w-full bg-blue-600 text-white py-2 px-4 rounded-md font-medium hover:bg-blue-700 transition duration-200">
        登録する
      </button>
      
    </form>
  </div>

  <script>
    document.getElementById('registrationForm').addEventListener('submit', function(event) {
      // フォームのデフォルトの送信動作（画面遷移）を防止
      event.preventDefault();

      // 1. 入力値の取得
      const nameInput = document.getElementById('name');
      const emailInput = document.getElementById('email');
      const passwordInput = document.getElementById('password');
      const agreeInput = document.getElementById('agree');

      const nameValue = nameInput.value.trim();
      const emailValue = emailInput.value.trim();
      const passwordValue = passwordInput.value; // パスワードはスペースを保持するためtrimしない
      const isAgreeChecked = agreeInput.checked;

      // エラーメッセージ表示エリアの取得
      const nameError = document.getElementById('nameError');
      const emailError = document.getElementById('emailError');
      const passwordError = document.getElementById('passwordError');
      const agreeError = document.getElementById('agreeError');
      const successMessage = document.getElementById('successMessage');

      // 初期化（前回のメッセージをクリア）
      nameError.textContent = '';
      emailError.textContent = '';
      passwordError.textContent = '';
      agreeError.textContent = '';
      successMessage.classList.add('hidden');

      let isValid = true;

      // 2. バリデーションの実行と3. フィードバック表示

      // 名前の確認
      if (!nameValue) {
        nameError.textContent = '名前を入力してください。';
        isValid = false;
      }

      // メールアドレスの確認（未入力および簡易フォーマットチェック）
      if (!emailValue) {
        emailError.textContent = 'メールアドレスを入力してください。';
        isValid = false;
      } else if (!emailValue.includes('@')) {
        emailError.textContent = '有効なメールアドレスを入力してください（@を含めてください）。';
        isValid = false;
      }

      // パスワードの確認（未入力および文字数チェック）
      if (!passwordValue) {
        passwordError.textContent = 'パスワードを入力してください。';
        isValid = false;
      } else if (passwordValue.length < 8) {
        passwordError.textContent = 'パスワードは8文字以上で入力してください。';
        isValid = false;
      }

      // 利用規約同意の確認
      if (!isAgreeChecked) {
        agreeError.textContent = '利用規約への同意が必要です。';
        isValid = false;
      }

      // すべてのバリデーションを通過した場合
      if (isValid) {
        successMessage.classList.remove('hidden');
        // 必要に応じてフォームをリセット
        document.getElementById('registrationForm').reset();
      }
    });
  </script>
</body>
</html>
